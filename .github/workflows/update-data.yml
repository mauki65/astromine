name: Update space data and deploy

# Builds fresh data every hour and publishes it straight to GitHub Pages.
# Data is NOT committed to the repo (keeps the repo small); the previous run's
# files are restored from the live site so incremental work (trajectories, history) carries over.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore previous data from the live site
        run: |
          mkdir -p data
          for f in asteroids comets nhats lambert prices close-approaches history taxonomy; do
            curl -fsSL --retry 2 "https://mauki65.github.io/spacemine/data/$f.json" -o "data/$f.json.tmp" \
              && mv "data/$f.json.tmp" "data/$f.json" || echo "no previous $f.json"
          done
      - run: node scripts/fetch-data.mjs
      - name: Composition and sizes from SsODNet (weekly)
        run: pip install --quiet pyarrow && python3 scripts/taxonomy.py
      - run: node scripts/lambert-batch.mjs
      - run: node scripts/report.mjs
      - name: Validate every number before publishing (fails = site keeps the last good version)
        run: node scripts/validate.mjs
      - run: node scripts/stamp.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
